# ─────────────────────────────────────────────────────────────────────
# SUI Formato 1743 — Facturación
# API: https://www.datos.gov.co/resource/gw2d-7n7y.json
# ─────────────────────────────────────────────────────────────────────
sui_facturacion:
  mapeo:
    niu:                          "NIU"                    # ID usuario (join key)
    car_t1743_cons_usuario:       "consumo_kwh_mes"       # kWh facturados
    car_t1743_dias_facturados:    "dias_facturados"        # Días del periodo
    car_t1743_tipo_usu_rc:        "tipo_usuario_cod"       # Código tipo usuario (1=Residencial)
    tipo_tarifa:                  "tipo_tarifa"            # REGULADA / NO REGULADA
    tipo_lectura:                 "tipo_lectura"           # REAL / ESTIMADA
    tipo_medidor:                 "tipo_medidor"           # ELECTRONICO / etc.
    fch_ini_per_fact:             "fecha_inicio_periodo"   # Inicio del periodo facturado
    fch_lectura_act:              "fecha_lectura_actual"   # Fecha de lectura
    fch_lectura_ant:              "fecha_lectura_anterior" # Lectura anterior
    fch_exped_factura:            "fecha_expedicion"       # Fecha de expedición
    fch_reg_contable:             "fecha_registro"         # Fecha registro contable
    car_carg_ano:                 "anio_carga"             # Año de carga
    car_carg_periodo:             "mes_carga"              # Mes de carga
    val_fact_cu:                  "valor_factura_cu"       # Valor factura CU
    val_total_fact:               "valor_total_factura"    # Valor total factura COP
    tarifa_apl:                   "tarifa_aplicada"        # Tarifa aplicada $/kWh
    val_subs_usu:                 "valor_subsidio"         # Valor del subsidio
    val_contrib:                  "valor_contribucion"     # Valor contribución
    car_t1743_cons_prom_sem:      "consumo_prom_semestre"  # Consumo promedio semestral
    car_t1743_cons_subsist:       "consumo_subsistencia"   # Consumo de subsistencia
    car_t1743_nro_familias:       "nro_familias"           # Número de familias
    car_t1743_carga_contratada:   "carga_contratada_kw"    # Carga contratada
    car_t1743_ene_activa_export:  "energia_exportada"      # Energía activa exportada
    id_factura:                   "id_factura"             # ID factura (NO feature)
    identificador_empresa:        "id_empresa"             # ID de la empresa
    are_esp_nombre:               "nombre_empresa"         # Nombre de la empresa/OR
    info_pred_util:               "info_predial"           # Info predial (join key)

  filtros:
    residencial: "car_t1743_tipo_usu_rc = '1'"
    nota: "tipo_usu_rc: 1=Residencial, 2=Comercial, 3=Industrial, etc."

  columnas_relevantes_core:
    - niu
    - car_t1743_cons_usuario     # → consumo_kwh_mes
    - car_t1743_dias_facturados  # → dias_facturados
    - car_t1743_tipo_usu_rc      # → filtro residencial
    - tipo_tarifa
    - tarifa_apl                 # → tarifa aplicada
    - fch_ini_per_fact           # → fecha del periodo
    - car_carg_ano               # → año
    - car_carg_periodo           # → mes
    - are_esp_nombre             # → operador_red
    - val_subs_usu               # → subsidio

# ─────────────────────────────────────────────────────────────────────
# Superservicios — Tarifas Publicadas
# API: https://www.datos.gov.co/resource/4is2-3nif.json
# ─────────────────────────────────────────────────────────────────────
tarifas_superservicios:
  mapeo:
    car_t1668_id_mercado:         "id_mercado"
    estrato_sector:               "estrato_sector"
    porcentaje_sub100_or:         "porcentaje_subsidio_100"  # Subsidio nivel 100%
    porcentaje_sub50_or:          "porcentaje_subsidio_50"   # Subsidio nivel 50%
    porcentaje_sub00_or:          "porcentaje_subsidio_base" # Subsidio base
    tarifa_nivel1_100_or:         "tarifa_nivel1_100"        # Tarifa nivel 1 (100%)
    tarifa_nivel1_50_or:          "tarifa_nivel1_50"
    tarifa_nivel1_00_or:          "tarifa_nivel1_base"
    tarifa_nivel2:                "tarifa_nivel2"
    tarifa_nivel3:                "tarifa_nivel3"
    tarifa_nivel4:                "tarifa_nivel4"
    tarifa_cfjm:                  "cargo_fijo_mensual"       # Cargo fijo
    tarifa_fch_pub:               "fecha_publicacion"
    id_empresa:                   "id_empresa"
    empresa:                      "nombre_empresa"
    car_carg_ano:                 "anio_carga"
    car_carg_periodo:             "mes_carga"

  notas:
    - "anio_corregido=9999 indica datos pendientes de corrección temporal"
    - "Hay múltiples estratos (1-6) por mercado-periodo"
    - "porcentaje_subsidio es la variable clave para el proyecto"

# ─────────────────────────────────────────────────────────────────────
# DNP Sisbén — Vivienda
# API: https://www.datos.gov.co/resource/np8m-kdhq.json
# ─────────────────────────────────────────────────────────────────────
sisben_vivienda:
  mapeo:
    cod_mpio:                     "codigo_municipio"
    zona:                         "zona_urbana_rural"        # 1=Urbana, 2=Rural
    llave:                        "llave_vivienda"           # ID vivienda (join key, NO feature)
    corte:                        "corte_sisben"             # SIV_2022
    fex:                          "factor_expansion"
    viv001:                       "tipo_vivienda"            # 1=Casa, 2=Apartamento, etc.
    viv002:                       "material_paredes"         # Material predominante
    viv003:                       "material_pisos"           # Material pisos (EXCLUIR)
    viv004:                       "servicio_acueducto"
    viv005:                       "servicio_alcantarillado"
    viv006:                       "servicio_energia"         # Tiene energía eléctrica
    viv007:                       "servicio_gas"
    viv008:                       "servicio_recoleccion"
    viv009:                       "numero_cuartos"           # Número de cuartos
    viv010:                       "numero_hogares"           # Hogares en la vivienda

  notas:
    - "Corte fijo: SIV_2022 (marzo 2022)"
    - "Variables codificadas numéricamente, requieren diccionario"
    - "zona: 1=Urbana, 2=Rural"
    - "viv001 tipo_vivienda: 1=Casa, 2=Apartamento, 3=Cuarto, etc."

# ─────────────────────────────────────────────────────────────────────
# SUI Formato 438 — Vínculo usuario-red
# API: https://www.datos.gov.co/resource/jhim-bsjc.json
# ─────────────────────────────────────────────────────────────────────
usuario_red:
  mapeo:
    niu:                          "NIU"                      # Join key
    car_t438_cod_conex:           "codigo_conexion"
    car_t438_tipo_conex:          "tipo_conexion"            # T=Transformador
    car_t438_n_tension:           "nivel_tension"
    car_t438_id_mercado:          "id_mercado"
    car_t438_grupo_calidad:       "grupo_calidad"
    car_t438_front_comer:         "frontera_comercial"
    nom_mercado:                  "nombre_mercado"           # Nombre del mercado/región
    identificador_empresa:        "id_empresa"
    are_esp_nombre:               "nombre_empresa"
    car_carg_ano:                 "anio_carga"
    car_carg_periodo:             "mes_carga"

  notas:
    - "Solo para joins/agregaciones, NUNCA como features directas"
    - "El campo nom_mercado permite unir con tarifas por mercado"
    - "grupo_calidad puede servir para agregar SAIDI/SAIFI"


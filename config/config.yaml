leakage:
  reglas_duras:
  - No usar rendimiento, produccion ni area_cosechada del año t como feature
  - Solo clima disponible <= fecha_corte
  - Solo precios anteriores a fecha_corte
  - Solo muestras de suelo anteriores a fecha_corte
  - Lags y rolling solo con t-1 y anteriores
  - Rolling-origin temporal para splits
  - Scaler/imputer/encoder ajustado solo en train
  - ENA fuera de entrenamiento si se usa como validacion externa
metricas:
  negocio: ingreso_esperado_cop
  ranking:
  - Precision_K10
  - Lift_K10
  regresion:
  - MAE
  - RMSE
  - MAPE
  - R2
model_mart:
  año_col: anio
  cultivo_col: cultivo
  departamento_col: departamento
  id_cols:

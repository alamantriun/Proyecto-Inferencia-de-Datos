# =============================================================================
# Solar-Rank: Esquema de las 12 tablas del pipeline de datos
# =============================================================================
# Cada tabla tiene: fuente, granularidad, columnas clave y notas.
# Referencia: docs/solar_dataset_architecture.csv
# =============================================================================

tables:

  # ── 01 ─────────────────────────────────────────────────────────────
  01_sui_facturacion_raw:
    fuente: "SUI Formato 1743"
    granularidad: "usuario-periodo"
    descripcion: "Facturación cruda descargada del portal de datos abiertos"
    columnas:
      - NIU                     # Identificador de usuario (join key, NO feature)
      - consumo_kwh_mes         # kWh facturados en el periodo
      - dias_facturados         # Días del periodo de facturación
      - tipo_usuario            # Residencial, comercial, industrial, etc.
      - tipo_tarifa             # Esquema tarifario aplicado
      - municipio               # Municipio del usuario
      - departamento            # Departamento
      - fecha_facturacion       # Fecha del periodo facturado
      - operador_red            # Empresa operadora
    notas:
      - "Filtrar tipo_usuario = 'Residencial' para el alcance del proyecto"
      - "Pueden existir múltiples registros por NIU (series mensuales)"

  # ── 02 ─────────────────────────────────────────────────────────────
  02_sui_features:
    fuente: "Derivada de 01_sui_facturacion_raw"
    granularidad: "usuario-fecha_corte"
    descripcion: "Features de consumo con ventanas históricas"
    columnas:
      - NIU
      - fecha_corte
      - consumo_kwh_dia         # consumo_kwh_mes / dias_facturados
      - consumo_promedio_12m    # Media de consumo_kwh_mes últimos 12 meses <= fecha_corte
      - variabilidad_consumo_12m # Std/CV de consumo últimos 12 meses <= fecha_corte
      - tendencia_consumo_12m   # Slope de regresión lineal consumo ~ mes (12m)
      - tipo_usuario
      - tipo_tarifa
      - municipio
      - departamento
      - operador_red
      - mes                     # Mes de la fecha_corte (estacionalidad)
    reglas_leakage:
      - "L03: Solo meses <= fecha_corte para medias/tendencias"
      - "L10: No random split; agrupar por NIU"

  # ── 03 ─────────────────────────────────────────────────────────────
  03_tarifas_superservicios:
    fuente: "Superservicios T3-T4"
    granularidad: "mercado-estrato-mes"
    descripcion: "Tarifas oficiales publicadas por Superservicios"
    columnas:
      - mercado
      - estrato_sector
      - mes_tarifa
      - tarifa_nivel1_cop_kwh
      - porcentaje_subsidio
    reglas_leakage:
      - "L04: Solo tarifas con fecha <= fecha_corte"

  # ── 04 ─────────────────────────────────────────────────────────────
  04_tarifas_region:
    fuente: "EPM u otro operador de mercado"
    granularidad: "mercado-mes"
    descripcion: "Costos unitarios regionales (CU, costo fijo)"
    columnas:
      - mercado
      - mes_tarifa
      - cu_total_cop_kwh
      - costo_fijo_cop
      - variacion_tarifa_12m    # Derivada: tendencia de tarifa sin mirar futuro
    reglas_leakage:
      - "L04: Solo tarifas con fecha <= fecha_corte"

  # ── 05 ─────────────────────────────────────────────────────────────
  05_upme_radiacion:
    fuente: "UPME FeatureServer"
    granularidad: "municipio-mes"
    descripcion: "Recurso solar mensual por municipio"
    columnas:
      - municipio
      - departamento
      - mes
      - radiacion_kwh_m2_dia
      - radiacion_min_kwh_m2_dia
      - radiacion_max_kwh_m2_dia
    reglas_leakage:
      - "L05: Mes compatible con fecha de predicción"

  # ── 06 ─────────────────────────────────────────────────────────────
  06_ideam_clima:
    fuente: "IDEAM Atlas / Estaciones"
    granularidad: "municipio/estacion-mes"
    descripcion: "Variables climáticas mensuales"
    columnas:
      - municipio
      - estacion_id
      - mes
      - insolacion_horas_dia
      - temperatura_media_c
      - temperatura_maxima_c
      - temperatura_minima_c
      - precipitacion_mm
      - humedad_relativa_pct
    reglas_leakage:
      - "L05: Mes compatible con fecha de predicción"
    notas:
      - "Incluir solo si supera prueba de utilidad predictiva (ablation)"

  # ── 07 ─────────────────────────────────────────────────────────────
  07_igac_catastro:
    fuente: "IGAC LADM-COL"
    granularidad: "predio-unidad_construccion"
    descripcion: "Información catastral de la vivienda"
    columnas:
      - predio_id
      - municipio
      - area_construida_m2
      - area_terreno_m2
      - total_plantas
      - anio_construccion
      - uso_construccion         # Filtro: solo 'Residencial'
    reglas_leakage:
      - "L06: Usar corte catastral disponible en la fecha de decisión"

  # ── 08 ─────────────────────────────────────────────────────────────
  08_sisben_vivienda:
    fuente: "DNP Sisbén Vivienda + Hogares"
    granularidad: "vivienda-municipio"
    descripcion: "Contexto socioeconómico de la vivienda"
    columnas:
      - vivienda_id
      - municipio
      - zona_urbana_rural
      - tipo_vivienda
      - material_paredes         # Optional: proxy constructivo
      - numero_cuartos_vivienda
      - numero_hogares_vivienda
    reglas_leakage:
      - "L07: Contexto estructural del corte 2022, no info actual"
    notas:
      - "Conservar fecha de corte del Sisbén en metadatos"

  # ── 09 ─────────────────────────────────────────────────────────────
  09_red_calidad:
    fuente: "XM/SIMEM"
    granularidad: "operador-año"
    descripcion: "Indicadores de calidad de red eléctrica"
    columnas:
      - operador_red
      - anio
      - saidi_horas
      - saifi_eventos
    reglas_leakage:
      - "L08: Último año disponible <= fecha_corte"
    notas:
      - "Relevante especialmente cuando hay batería/almacenamiento"

  # ── 10 ─────────────────────────────────────────────────────────────
  10_usuario_red:
    fuente: "SUI Formato 438"
    granularidad: "usuario-red"
    descripcion: "Vínculo entre usuario y alimentador/transformador"
    columnas:
      - NIU
      - alimentador_id          # Solo para joins, NUNCA como feature
      - transformador_id        # Solo para joins, NUNCA como feature
    reglas_leakage:
      - "L10: IDs solo para agregación, no como predictores"

  # ── 11 ─────────────────────────────────────────────────────────────
  11_sistema_escenarios:
    fuente: "Diseño técnico / cotizaciones"
    granularidad: "caso-instalacion"
    descripcion: "Parámetros del sistema solar fotovoltaico"
    columnas:
      - escenario_id
      - potencia_sistema_kwp
      - costo_instalacion_cop
      - eficiencia_sistema_pct
      - degradacion_anual_pct
      - mantenimiento_anual_cop
      - autoconsumo_ratio
      - valor_excedente_cop_kwh
      - bateria_si_no
      - capacidad_bateria_kwh
    reglas_leakage:
      - "L12: Train/test con perfiles base independientes"
    notas:
      - "Combinaciones deben ser técnicamente plausibles"
      - "Si bateria_si_no=0 → capacidad_bateria_kwh=0"

  # ── 12 ─────────────────────────────────────────────────────────────
  12_model_mart:
    fuente: "Derivada (join de todas las anteriores)"
    granularidad: "caso/usuario-fecha_corte"
    descripcion: "Tabla final para entrenamiento con features + targets"
    columnas:
      - "Todas las features de CORE_V1 + ADD_ON_V2 (ver feature_sets.json)"
      - fecha_corte
      - payback_years            # Target regresión
      - payback_le_5             # Target clasificación
    reglas_leakage:
      - "L09: payback, ahorro, generación NO son features"
      - "L11: Imputadores/encoders solo con train"
      - "L13: Calibración solo con validation"
